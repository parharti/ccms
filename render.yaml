# Render Blueprint: free-tier backend (see "Free deployment" in
# DEPLOYMENT.md).
#
#   ccms-backend   FastAPI (backend/Dockerfile), free web service
#
# The frontend is deployed on Vercel (frontend/vercel.json), which proxies
# /api/* to this backend so the login cookie stays first-party.
#
# Postgres is NOT created here -- it lives on Aiven (free plan). Paste its
# Service URI into DATABASE_URL when Render asks for it.

services:
  - type: web
    name: ccms-backend
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /docs
    envVars:
      # The Dockerfile's uvicorn listens on 8000; tell Render to route there.
      - key: PORT
        value: "8000"
      # Aiven Service URI, e.g.
      # postgres://avnadmin:PASSWORD@pg-xxxx.aivencloud.com:12345/defaultdb?sslmode=require
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      # The Vercel frontend's public URL, e.g. https://ccms.vercel.app
      - key: FRONTEND_ORIGINS
        sync: false
